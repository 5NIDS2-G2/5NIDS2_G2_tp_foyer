version: "3.8"

services:
  mysqldb:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_DATABASE=timesheet_db
    ports:
      - 3306:3306
    volumes:
      - db:/var/lib/mysql

  app-spring:
    depends_on:
      - mysqldb
    image: selim19/tp-foyer:5.0.0
    restart: on-failure
    ports:
      - 8082:8082
    environment:
      SPRING APPLICATION_JSON: '{
        "spring.datasource.url" : "jdbc:mysql://192.168.50.4:3306/timesheet_db?createDatabaseIfNotExist=true",
        "spring.datasource.username"  : "root", 
        "spring.datasource.password"  : null,
        "spring.jpa.properties.hibernate.dialect" : "org.hibernate.dialect.MySQL8Dialect",
        "spring.jpa.hibernate.ddl-auto" : "update",
        "management.endpoints.web.exposure.include" : "prometheus",
        "server.servlet.context.path" : "/tpfoyer",
        "server.port" : "8082",
        "management.endpoint.prometheus.enabled" : "true"
      }'
    stdin_open: true
    tty: true

volumes:
  db :